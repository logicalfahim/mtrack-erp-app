name: Inspect ERP API

on:
  workflow_dispatch:

permissions: write-all

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch API record structure
        run: |
          echo "### ERP Live Schema Inspection" > schema.txt
          echo '```json' >> schema.txt
          echo "=== 1. Sample Install Request Record ===" >> schema.txt
          curl -s -m 10 "https://erp.mtrack.com.bd/api/v1/install-requests?limit=1" >> schema.txt || true
          echo "" >> schema.txt
          echo "=== 2. GET /api/v1/users ===" >> schema.txt
          curl -s -i -m 10 "https://erp.mtrack.com.bd/api/v1/users" | head -n 25 >> schema.txt || true
          echo "" >> schema.txt
          echo "=== 3. GET /api/v1/customers ===" >> schema.txt
          curl -s -i -m 10 "https://erp.mtrack.com.bd/api/v1/customers" | head -n 25 >> schema.txt || true
          echo "" >> schema.txt
          echo "=== 4. GET /api/v1/staff ===" >> schema.txt
          curl -s -i -m 10 "https://erp.mtrack.com.bd/api/v1/staff" | head -n 25 >> schema.txt || true
          echo '```' >> schema.txt
          gh issue create --title "ERP Schema and User Endpoints" --body-file schema.txt --repo logicalfahim/mtrack-erp-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
