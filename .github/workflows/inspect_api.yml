name: Inspect ERP API

on:
  workflow_dispatch:

permissions: write-all

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch API responses
        run: |
          echo "### ERP API Inspection Report" > api_report.txt
          echo '```json' >> api_report.txt
          echo "=== GET /api/v1/erp-dashboard ===" >> api_report.txt
          curl -sL -m 15 -H "Accept: application/json" -H "User-Agent: MTrackApp/1.0" "https://erp.mtrack.com.bd/api/v1/erp-dashboard" | head -c 30000 >> api_report.txt || echo "Failed" >> api_report.txt
          echo "" >> api_report.txt
          echo "=== GET /api/v1/vehiclesvehicles ===" >> api_report.txt
          curl -sL -m 15 -H "Accept: application/json" -H "User-Agent: MTrackApp/1.0" "https://erp.mtrack.com.bd/api/v1/vehiclesvehicles" | head -c 30000 >> api_report.txt || echo "Failed" >> api_report.txt
          echo "" >> api_report.txt
          echo "=== GET /api/v1/vehicles ===" >> api_report.txt
          curl -sL -m 15 -H "Accept: application/json" -H "User-Agent: MTrackApp/1.0" "https://erp.mtrack.com.bd/api/v1/vehicles" | head -c 30000 >> api_report.txt || echo "Failed" >> api_report.txt
          echo '```' >> api_report.txt
          gh issue create --title "ERP API Inspection Data" --body-file api_report.txt --repo logicalfahim/mtrack-erp-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
