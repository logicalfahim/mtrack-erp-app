name: Inspect Sagor Sales
on:
  workflow_dispatch:

permissions: write-all

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ERP Endpoints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import urllib.request, urllib.error, json, subprocess

          endpoints = [
              'api/v1/sales',
              'api/v1/seller-dashboard',
              'api/v1/erp-dashboard',
              'api/v1/vehicles',
              'api/v1/vehicles?seller=sagor',
              'api/v1/sales?seller=sagor',
              'api/v1/install-requests?ref_name=sagor',
              'api/v1/install-requests?seller=sagor',
              'api/v1/install-requests?limit=100'
          ]

          report = "### Endpoint Probe Results\n\n"

          for ep in endpoints:
              url = f"https://erp.mtrack.com.bd/{ep}"
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req) as resp:
                      body = resp.read().decode('utf-8')
                      code = resp.status
                      snippet = body[:500]
                      report += f"**`GET /{ep}`** -> `{code}`\n```json\n{snippet}\n```\n\n"
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode('utf-8', errors='ignore')[:300]
                  report += f"**`GET /{ep}`** -> `{e.code}`\n```json\n{err_body}\n```\n\n"
              except Exception as e:
                  report += f"**`GET /{ep}`** -> `Error: {e}`\n\n"

          subprocess.run(['gh', 'issue', 'create', '--repo', 'logicalfahim/mtrack-erp-app', '--title', 'ERP Endpoint Probe Report', '--body', report], check=True)
          EOF
