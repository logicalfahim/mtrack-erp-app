name: Build Android APK (M Track Installer)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🛠️ Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build_output.log

      - name: 📝 Show Build Log on Failure
        if: failure()
        run: |
          echo "### ⚠️ Build Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 80 build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 📦 Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: MTrack-Installer-v1.0-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
