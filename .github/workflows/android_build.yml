name: Build Android APK (M ERP)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

permissions: write-all

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🛠️ Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build_log.txt
        continue-on-error: true

      - name: 🔍 Verify and Report Compile Errors
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Build failed! Creating diagnostics issue..."
            tail -n 80 build_log.txt > err_summary.txt
            gh issue create --title "CI Diagnostics $(date +%s)" --body-file err_summary.txt || true
            exit 1
          fi

      - name: 📦 Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: M-ERP-v1.0-Debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
