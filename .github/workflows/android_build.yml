name: Build Android APK (M Track Installer)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🛠️ Build Debug APK
        run: |
          ./gradlew :app:assembleDebug > build_output.log 2>&1 || true

      - name: 📝 Post Build Diagnostics
        if: always()
        run: |
          echo "### 📋 Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 60 build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          BODY=$(grep -A 35 "FAILURE: Build failed" build_output.log || tail -n 50 build_output.log)
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$BODY" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 🔍 Locate Generated APK
        run: |
          ls -la app/build/outputs/apk/ || true
          find app/build/outputs -name "*.apk" || true

      - name: 📦 Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: M-ERP-v1.0-Debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
